<html>
  <head>
    <title>Context Doctor Settings</title>
  </head>

  <body>
    <div x-data>
      <template x-if="config">
        <div>
          <div class="section-title">Context Doctor</div>

          <div class="section">
            <div class="section-title">Experimental</div>

            <div class="field">
              <div class="field-label">
                <div class="field-title">Minify instead of beautify</div>
                <div class="field-description">
                  Output compact JSON with no whitespace.
                </div>
              </div>
              <div class="field-control">
                <label class="toggle">
                  <input type="checkbox" x-model="config.minify" />
                  <span class="toggler"></span>
                </label>
              </div>
            </div>
          </div>

          <div class="section">
            <div class="section-title">Debug</div>

            <div class="field">
              <div class="field-label">
                <div class="field-title">Use standard mode</div>
                <div class="field-description">
                  Use json_repair standard mode without schema guidance. When
                  disabled, salvage mode with A0 schema is used.
                </div>
              </div>
              <div class="field-control">
                <label class="toggle">
                  <input type="checkbox" x-model="config.use_standard_mode" />
                  <span class="toggler"></span>
                </label>
              </div>
            </div>

            <div class="field">
              <div class="field-label">
                <div class="field-title">Update log content</div>
                <div class="field-description">
                  Replace the View Details content shown in the WebUI log with
                  repaired JSON. Kvps and heading are always updated regardless
                  of this setting. Disable to keep raw model output in the log
                  for debugging.
                </div>
              </div>
              <div class="field-control">
                <label class="toggle">
                  <input type="checkbox" x-model="config.update_log" />
                  <span class="toggler"></span>
                </label>
              </div>
            </div>

            <div class="field">
              <div class="field-label">
                <div class="field-title">Suppress XML output</div>
                <div class="field-description">
                  Replace corrupted tool calls containing XML tags with an empty
                  JSON object. Disable to treat XML-containing text as raw
                  thoughts instead.
                </div>
              </div>
              <div class="field-control">
                <label class="toggle">
                  <input type="checkbox" x-model="config.suppress_xml" />
                  <span class="toggler"></span>
                </label>
              </div>
            </div>
          </div>
        </div>
      </template>
    </div>
  </body>
</html>
